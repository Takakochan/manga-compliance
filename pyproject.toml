[project]
name = "manga-compliance"
version = "0.1.0"
description = "Country-by-country content checks for manga pages, with verified citations."
requires-python = ">=3.12"
dependencies = [
    "fire>=0.7.1",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manga_compliance"]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "fire"
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
